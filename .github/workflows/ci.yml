name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format kontrolü
        run: ruff format --check src tests
      - name: Testler
        run: pytest --cov=tms29 --cov-report=term-missing

  # Ayrı bir iş: notebook'un çalışması testlerden bağımsız bir iddia.
  # Aynı işe koyulsaydı, testler geçtiği halde notebook'un bozuk olduğu
  # durumda hangisinin kırıldığı rozetten anlaşılmazdı.
  grafikler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: pip install -e ".[dev]"
      - name: Grafikleri yeniden üret
        run: python docs/grafikleri_uret.py
      - name: Görseller depodakiyle tutarlı mı
        # Bayt bayt karşılaştırma bilerek yapılmıyor: matplotlib sürümü
        # değişince aynı kod farklı bayt üretir ve CI sebepsiz kırmızıya
        # dönerdi. Gerekçe docs/grafikleri_dogrula.py'de yazılı.
        run: python docs/grafikleri_dogrula.py
